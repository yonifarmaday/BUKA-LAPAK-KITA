# BUKA LAPAK KITA (Warung Sembako Dini) — Cloudflare Worker + D1 + KV
# ⚠ SEBELUM DEPLOY: ganti 2 baris "GANTI-DENGAN-..." di bawah dengan ID dari akun Cloudflare Anda.
#   Tanpa ini deploy PASTI gagal. Langkah lengkap: README.md bagian "Cara pasang".
# Nama di bawah harus sama dengan nama Worker yang dibuat di dashboard Cloudflare.
name = "buka-lapak-kita"
main = "src/index.js"
compatibility_date = "2025-09-01"

# file web (index.html, gambar, ikon) dilayani langsung dari folder public/
# /api/* dan /files/* diproses Worker dulu
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/files/*"]

# database utama
[[d1_databases]]
binding = "DB"
database_name = "buka-lapak-kita-db"
database_id = "GANTI-DENGAN-DATABASE-ID-D1"

# penyimpanan foto produk / iklan / logo / QRIS
[[kv_namespaces]]
binding = "FILES"
id = "GANTI-DENGAN-ID-KV"

[observability]
enabled = true

# Secret (JANGAN ditulis di file ini, isi lewat dashboard / perintah):
#   npx wrangler secret put JWT_SECRET       → teks acak min. 32 karakter (wajib)
#   npx wrangler secret put RAJAONGKIR_KEY   → API key RajaOngkir Komerce (opsional, untuk ongkir otomatis J&T)
